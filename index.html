<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mini Driving Simulator 3D</title>
  <style>
    #gamepad-status {
      position: fixed; top: 12px; left: 12px; right: 144px;
      z-index: 5; padding: 10px; border-radius: 6px;
      color: white; background: rgba(0, 0, 0, 0.65);
      font: 14px sans-serif; pointer-events: none;
    }
    #speedometer {
      position: fixed; top: 12px; right: 12px;
      z-index: 5; width: 90px; padding: 12px;
      border-radius: 8px; text-align: right;
      color: white; background: rgba(0, 0, 0, 0.75);
      font: 14px sans-serif; pointer-events: none;
    }
    #speed-value {
      display: block; font-size: 32px; font-weight: bold;
      font-variant-numeric: tabular-nums;
    }
    #camera-mode {
      position: fixed; bottom: 16px; left: 12px; z-index: 5;
      padding: 10px; border-radius: 6px; font: 14px sans-serif;
      color: white; background: rgba(0, 0, 0, 0.65); pointer-events: none;
    }
    #collision-flash {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse, transparent 40%, rgba(220, 30, 30, 0.65));
      border: 6px solid rgba(220, 30, 30, 0.8);
    }
  </style>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="./src/controls/gamepad-input.js"></script>
  <script src="./src/components/vehicle-controller.js"></script>
  <script src="./src/components/follow-camera.js"></script>
  <script src="./src/components/scenery.js"></script>
</head>

<body>
  <div id="camera-mode">Câmera: atrás do carro · Y para trocar</div>
  <div id="speedometer" role="meter" aria-label="Velocidade em quilômetros por hora"
    aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
    <span id="speed-value">0</span> km/h
  </div>
  <div id="gamepad-status">Conecte o controle e pressione um botão. Teclado disponível.</div>
  <div id="collision-flash" aria-hidden="true"></div>
  <a-scene shadow="type: pcfsoft">

    <a-assets>
        <a-asset-item
            id="car-model"
            src="./input/car-v1.glb">
        </a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
    <a-entity light="type: hemisphere; color: #e8f1ff; groundColor: #b4bec9; intensity: 0.8"></a-entity>
    <a-entity
      position="-12 24 10"
      light="type: directional; color: #fff4df; intensity: 0.8; castShadow: true;
        shadowCameraLeft: -25; shadowCameraRight: 25;
        shadowCameraTop: 25; shadowCameraBottom: -25;
        shadowCameraNear: 0.5; shadowCameraFar: 70;
        shadowMapWidth: 2048; shadowMapHeight: 2048; shadowBias: -0.0002">
    </a-entity>


    <a-entity
        id="car"
        gltf-model="#car-model"
        shadow="cast: true; receive: false"
        position="0 0 -4"
        rotation="0 90 0"
        vehicle-controller="ground: #ground; maxSpeed: 60; reverseSpeed: 15"
        scale="5 5 5">
    </a-entity>

    <a-plane
      id="ground"
      rotation="-90 0 0"
      width="30"
      height="30"
      shadow="cast: false; receive: true"
      material="roughness: 1; metalness: 0"
      parking-surface
      color="#56534e">
    </a-plane>

    <a-entity boundary-walls="ground: #ground; height: 1; thickness: 0.4"></a-entity>


    <a-camera
      position="-8 4 -4"
      follow-camera="target: #car; ground: #ground; distance: 8; height: 4; overheadHeight: 26"
      wasd-controls-enabled="false"
      look-controls-enabled="false">
    </a-camera>

    <a-sky cloudy-sky color="#76add4"></a-sky>
  </a-scene>
</body>
</html>
