<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Driving Simulator 3D</title>
  <style>
    #controls-panel, #speedometer, #camera-mode {
      position: fixed;
      z-index: 5;
      box-sizing: border-box;
      color: #edf3f6;
      background: linear-gradient(135deg, rgba(26, 38, 47, 0.92), rgba(16, 25, 32, 0.84));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(12px);
      font: 13px/1.5 "Segoe UI", sans-serif;
      pointer-events: none;
    }
    #controls-panel::before, #speedometer::before, #camera-mode::before {
      display: block;
      margin-bottom: 7px;
      color: #9fd4dc;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.6px;
    }
    #controls-panel::before, #speedometer::before {
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      text-align: left;
    }
    #controls-panel {
      top: 20px; left: 20px;
      width: max-content;
      max-width: min(680px, calc(100vw - 184px));
      padding: 14px 18px;
    }
    #controls-panel::before { content: "CONTROLES"; }
    #gamepad-status::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: #5b6871;
      opacity: 0.6;
      vertical-align: middle;
    }
    #gamepad-status.connected::before {
      background: #4ade80;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.7);
      opacity: 1;
    }
    .controls-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 0;
    }
    .legend-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 18px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }
    .legend-group:first-child { padding-left: 0; border-left: 0; }
    .legend-group:last-child { padding-right: 0; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      white-space: nowrap;
    }
    .legend-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      width: 54px;
      height: 34px;
    }
    .legend-icon svg { width: 100%; height: 100%; }
    .round-icon {
      width: 34px;
      margin: 0 10px;
      box-sizing: border-box;
      padding: 7px;
      border: 1.5px solid rgba(237, 243, 246, 0.75);
      border-radius: 50%;
    }
    .keycap {
      box-sizing: border-box;
      width: 30px;
      height: 30px;
      border: 1.5px solid rgba(237, 243, 246, 0.75);
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      line-height: 27px;
      text-align: center;
    }
    .keycap.wide { width: auto; padding: 0 10px; font-size: 13px; }
    .keys { display: flex; gap: 4px; }
    .keys-wide .keys { min-width: 64px; }
    #legend-keyboard { display: flex; }
    #legend-gamepad { display: none; }
    body[data-input-mode="gamepad"] #legend-keyboard { display: none; }
    body[data-input-mode="gamepad"] #legend-gamepad { display: flex; }
    .keycap.key-a { color: #6cc24a; }
    .keycap.key-b { color: #e5484d; }
    #gamepad-status {
      width: 0;
      min-width: 100%;
      margin-top: 10px;
      color: #afbec7;
      font-size: 11px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-line;
      padding-left: 16px;
      text-indent: -16px;
    }
    #speedometer {
      top: 20px; right: 20px;
      width: 124px; padding: 14px 18px;
      text-align: right;
      color: #afbec7;
      font-size: 12px;
    }
    #speedometer::before { content: "VELOCIDADE"; }
    #speed-value {
      display: block;
      color: #ffffff;
      font-size: 42px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }
    #speed-unit-row {
      position: relative;
    }
    #reverse-indicator {
      display: none;
      position: absolute;
      left: 0;
      color: #ff6b6b;
      font-weight: 700;
      letter-spacing: 1px;
    }
    #reverse-indicator.visible { display: inline; }
    #camera-mode {
      bottom: 20px; left: 20px;
      max-width: calc(100vw - 120px);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #camera-mode::before { content: none; }
    #camera-mode-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      white-space: nowrap;
    }
    #camera-mode-hint svg { width: 20px; height: 20px; flex: none; }
    #camera-mode-hint .hint-key { width: 22px; height: 22px; border-radius: 6px; font-size: 12px; line-height: 19px; }
    #camera-mode-hint .hint-pad { display: none; }
    body[data-input-mode="gamepad"] #camera-mode-hint .hint-key { display: none; }
    body[data-input-mode="gamepad"] #camera-mode-hint .hint-pad { display: block; }
    @media (max-width: 480px) {
      #controls-panel { top: 12px; left: 12px; max-width: calc(100vw - 140px); padding: 12px; }
      .controls-legend { gap: 10px 20px; }
      .legend-group, .legend-group:last-child { padding: 0; border-left: 0; }
      #speedometer { top: 12px; right: 12px; width: 104px; padding: 12px; }
      #speed-value { font-size: 36px; }
      #camera-mode { bottom: 12px; left: 12px; padding: 12px; }
    }
    #reset-fade {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      opacity: 0;
      background: #000;
    }
    #collision-flash {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse, transparent 40%, rgba(220, 30, 30, 0.65));
      border: 6px solid rgba(220, 30, 30, 0.8);
    }
    #fullscreen-button {
      position: fixed;
      z-index: 5;
      right: 20px;
      bottom: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: linear-gradient(135deg, rgba(26, 38, 47, 0.92), rgba(16, 25, 32, 0.84));
      color: #edf3f6;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    }
    @media (max-width: 480px) {
      #fullscreen-button { right: 12px; bottom: 12px; width: 40px; height: 40px; font-size: 18px; }
    }
    body.is-fullscreen #controls-panel,
    body.is-fullscreen #speedometer,
    body.is-fullscreen #camera-mode {
      display: none;
    }
  </style>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="./src/controls/gamepad-input.js"></script>
  <script src="./src/controls/keyboard-input.js"></script>
  <script src="./src/components/vehicle-controller.js"></script>
  <script src="./src/components/boundary-walls.js"></script>
  <script src="./src/components/follow-camera.js"></script>
  <script src="./src/components/exterior-landscape.js"></script>
  <script src="./src/components/stone-wall.js"></script>
  <script src="./src/components/parking-surface.js"></script>
  <script src="./src/components/cloudy-sky.js"></script>
  <script src="./src/components/fullscreen-button.js"></script>
</head>

<body>
  <div id="camera-mode">
    <span id="camera-mode-label">Câmera: atrás do carro</span>
    <span id="camera-mode-hint">
      <span class="hint-key keycap">Y</span>
      <svg class="hint-pad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="3.5" width="11" height="8" rx="1"></rect>
        <rect x="10.5" y="10.5" width="11" height="8" rx="1"></rect>
      </svg>
      para trocar
    </span>
  </div>
  <div id="speedometer" role="meter" aria-label="Velocidade em quilômetros por hora"
    aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
    <span id="speed-value">0</span>
    <div id="speed-unit-row">
      <span id="reverse-indicator" aria-hidden="true">R</span>
      <span id="speed-unit">km/h</span>
    </div>
  </div>
  <div id="controls-panel">
    <div class="controls-legend" id="legend-keyboard">
      <div class="legend-group">
        <div class="legend-item"><span class="keys"><span class="keycap">W</span></span>Frente</div>
        <div class="legend-item"><span class="keys"><span class="keycap">S</span></span>Ré</div>
      </div>
      <div class="legend-group keys-wide">
        <div class="legend-item"><span class="keys"><span class="keycap wide">Espaço</span></span>Frear</div>
        <div class="legend-item"><span class="keys"><span class="keycap">R</span></span>Início</div>
      </div>
      <div class="legend-group keys-wide">
        <div class="legend-item"><span class="keys"><span class="keycap">Y</span></span>Trocar câmera</div>
        <div class="legend-item"><span class="keys"><span class="keycap">A</span><span class="keycap">D</span></span>Esquerda/Direita</div>
      </div>
    </div>
    <div class="controls-legend" id="legend-gamepad">
      <div class="legend-group">
        <div class="legend-item"><span class="keycap">R</span>Frente</div>
        <div class="legend-item"><span class="keycap">L</span>Ré</div>
      </div>
      <div class="legend-group">
        <div class="legend-item"><span class="keycap key-a">A</span>Frear</div>
        <div class="legend-item"><span class="keycap key-b">B</span>Início</div>
      </div>
      <div class="legend-group">
        <div class="legend-item">
          <span class="legend-icon round-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="3.5" width="11" height="8" rx="1"></rect>
            <rect x="10.5" y="10.5" width="11" height="8" rx="1"></rect>
          </svg></span>Trocar câmera
        </div>
        <div class="legend-item">
          <span class="legend-icon stick-icon">
            <svg viewBox="0 0 54 34" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 11 3 17l5 6"></path>
              <circle cx="27" cy="17" r="12"></circle>
              <circle cx="27" cy="17" r="7" stroke-width="1.5"></circle>
              <path d="m46 11 5 6-5 6"></path>
            </svg>
          </span>Direita/Esquerda
        </div>
      </div>
    </div>
    <div id="gamepad-status">Controle não conectado
Use o teclado ou configure o DroidJoy no PC e celular.</div>
  </div>
  <div id="reset-fade" aria-hidden="true"></div>
  <div id="collision-flash" aria-hidden="true"></div>
  <button id="fullscreen-button" type="button" aria-label="Tela cheia" aria-pressed="false">⤢</button>
  <a-scene shadow="type: pcfsoft" xr-mode-ui="enabled: false">

    <a-assets>
        <a-asset-item
            id="car-model"
            src="./input/car-v1.glb">
        </a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
    <a-entity light="type: hemisphere; color: #e8f1ff; groundColor: #b4bec9; intensity: 0.8"></a-entity>
    <a-entity
      position="-12 24 10"
      light="type: directional; color: #fff4df; intensity: 0.8; castShadow: true;
        shadowCameraLeft: -25; shadowCameraRight: 25;
        shadowCameraTop: 25; shadowCameraBottom: -25;
        shadowCameraNear: 0.5; shadowCameraFar: 70;
        shadowMapWidth: 2048; shadowMapHeight: 2048; shadowBias: -0.0002">
    </a-entity>


    <a-entity
        id="car"
        gltf-model="#car-model"
        shadow="cast: true; receive: false"
        position="0 0 -4"
        rotation="0 90 0"
        vehicle-controller="ground: #ground; maxSpeed: 60; reverseSpeed: 15"
        scale="5 5 5">
    </a-entity>

    <a-plane
      id="ground"
      rotation="-90 0 0"
      width="30"
      height="30"
      shadow="cast: false; receive: true"
      material="roughness: 1; metalness: 0"
      parking-surface
      color="#56534e">
    </a-plane>

    <a-entity boundary-walls="ground: #ground; height: 1; thickness: 0.4"></a-entity>

    <a-plane
      id="exterior-ground"
      position="0 -0.03 0"
      rotation="-90 0 0"
      width="180"
      height="180"
      material="roughness: 1; metalness: 0"
      shadow="cast: false; receive: true"
      exterior-landscape="ground: #ground"
      color="#64854b">
    </a-plane>


    <a-camera
      position="-8 4 -4"
      follow-camera="target: #car; ground: #ground; distance: 8; height: 4; overheadHeight: 26"
      wasd-controls-enabled="false"
      look-controls-enabled="false">
    </a-camera>

    <a-sky cloudy-sky color="#76add4"></a-sky>
  </a-scene>
</body>
</html>
