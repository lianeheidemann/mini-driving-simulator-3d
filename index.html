<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Driving Simulator 3D</title>
  <link rel="stylesheet" href="./styles/hud.css">

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="./src/controls/gamepad-input.js"></script>
  <script src="./src/controls/keyboard-input.js"></script>
  <script src="./src/controls/input-manager.js"></script>
  <script src="./src/hud/hud.js"></script>
  <script src="./src/hud/fullscreen-button.js"></script>
  <script src="./src/vehicle/vehicle-controller.js"></script>
  <script src="./src/camera/follow-camera.js"></script>
  <script src="./src/scene/boundary-walls.js"></script>
  <script src="./src/scene/exterior-landscape.js"></script>
  <script src="./src/scene/stone-wall.js"></script>
  <script src="./src/scene/parking-surface.js"></script>
  <script src="./src/scene/cloudy-sky.js"></script>
</head>

<body>
  <div id="camera-mode">
    <span id="camera-mode-label">Câmera: atrás do carro</span>
    <span id="camera-mode-hint">
      <span class="hint-key keycap">Y</span>
      <svg class="hint-pad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="3.5" width="11" height="8" rx="1"></rect>
        <rect x="10.5" y="10.5" width="11" height="8" rx="1"></rect>
      </svg>
      para trocar
    </span>
  </div>
  <div id="speedometer" role="meter" aria-label="Velocidade em quilômetros por hora"
    aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
    <span id="speed-value">0</span>
    <div id="speed-unit-row">
      <span id="reverse-indicator" aria-hidden="true">R</span>
      <span id="speed-unit">km/h</span>
    </div>
  </div>
  <div id="controls-panel">
    <div class="controls-legend" id="legend-keyboard">
      <div class="legend-group">
        <div class="legend-item"><span class="keys"><span class="keycap">W</span></span>Frente</div>
        <div class="legend-item"><span class="keys"><span class="keycap">S</span></span>Ré</div>
      </div>
      <div class="legend-group keys-wide">
        <div class="legend-item"><span class="keys"><span class="keycap wide">Espaço</span></span>Frear</div>
        <div class="legend-item"><span class="keys"><span class="keycap">R</span></span>Início</div>
      </div>
      <div class="legend-group keys-wide">
        <div class="legend-item"><span class="keys"><span class="keycap">Y</span></span>Trocar câmera</div>
        <div class="legend-item"><span class="keys"><span class="keycap">A</span><span class="keycap">D</span></span>Esquerda/Direita</div>
      </div>
    </div>
    <div class="controls-legend" id="legend-gamepad">
      <div class="legend-group">
        <div class="legend-item"><span class="keycap">R</span>Frente</div>
        <div class="legend-item"><span class="keycap">L</span>Ré</div>
      </div>
      <div class="legend-group">
        <div class="legend-item"><span class="keycap key-a">A</span>Frear</div>
        <div class="legend-item"><span class="keycap key-b">B</span>Início</div>
      </div>
      <div class="legend-group">
        <div class="legend-item">
          <span class="legend-icon round-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="3.5" width="11" height="8" rx="1"></rect>
            <rect x="10.5" y="10.5" width="11" height="8" rx="1"></rect>
          </svg></span>Trocar câmera
        </div>
        <div class="legend-item">
          <span class="legend-icon stick-icon">
            <svg viewBox="0 0 54 34" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 11 3 17l5 6"></path>
              <circle cx="27" cy="17" r="12"></circle>
              <circle cx="27" cy="17" r="7" stroke-width="1.5"></circle>
              <path d="m46 11 5 6-5 6"></path>
            </svg>
          </span>Direita/Esquerda
        </div>
      </div>
    </div>
    <div id="gamepad-status">Controle não conectado
Use o teclado ou configure o DroidJoy no PC e celular.</div>
  </div>
  <div id="reset-fade" aria-hidden="true"></div>
  <div id="collision-flash" aria-hidden="true"></div>
  <button id="fullscreen-button" type="button" aria-label="Tela cheia" aria-pressed="false">⤢</button>
  <a-scene shadow="type: pcfsoft" xr-mode-ui="enabled: false">

    <a-assets>
        <a-asset-item
            id="car-model"
            src="./input/car-v1.glb">
        </a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
    <a-entity light="type: hemisphere; color: #e8f1ff; groundColor: #b4bec9; intensity: 0.8"></a-entity>
    <a-entity
      position="-12 24 10"
      light="type: directional; color: #fff4df; intensity: 0.8; castShadow: true;
        shadowCameraLeft: -25; shadowCameraRight: 25;
        shadowCameraTop: 25; shadowCameraBottom: -25;
        shadowCameraNear: 0.5; shadowCameraFar: 70;
        shadowMapWidth: 2048; shadowMapHeight: 2048; shadowBias: -0.0002">
    </a-entity>


    <a-entity
        id="car"
        gltf-model="#car-model"
        shadow="cast: true; receive: false"
        position="0 0 -4"
        rotation="0 90 0"
        vehicle-controller="ground: #ground; maxSpeed: 60; reverseSpeed: 15"
        scale="5 5 5">
    </a-entity>

    <a-plane
      id="ground"
      rotation="-90 0 0"
      width="30"
      height="30"
      shadow="cast: false; receive: true"
      material="roughness: 1; metalness: 0"
      parking-surface
      color="#56534e">
    </a-plane>

    <a-entity boundary-walls="ground: #ground; height: 1; thickness: 0.4"></a-entity>

    <a-plane
      id="exterior-ground"
      position="0 -0.03 0"
      rotation="-90 0 0"
      width="180"
      height="180"
      material="roughness: 1; metalness: 0"
      shadow="cast: false; receive: true"
      exterior-landscape="ground: #ground"
      color="#64854b">
    </a-plane>


    <a-camera
      position="-8 4 -4"
      follow-camera="target: #car; ground: #ground; distance: 8; height: 4; overheadHeight: 26"
      wasd-controls-enabled="false"
      look-controls-enabled="false">
    </a-camera>

    <a-sky cloudy-sky color="#76add4"></a-sky>
  </a-scene>
</body>
</html>
